name: Deploy booking site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      - uses: actions/configure-pages@v5
      - id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        name: Deploy uploaded Pages artifact
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        with:
          script: |
            // Use the upload's artifact ID directly; the artifact-listing
            // service can omit a successfully uploaded artifact.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return an artifact ID.');
            }
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data: result} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo, deployment_id: deploymentId
              });
              if (result.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                core.info(`Published ${deployment.page_url}`);
                return;
              }
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'build_failed', 'errored', 'canceled', 'cancelled'].includes(result.status)) {
                throw new Error(`Pages deployment failed: ${result.status}`);
              }
              core.info(`Pages deployment: ${result.status}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              ...context.repo, deployment_id: deploymentId
            });
            throw new Error('Pages deployment did not finish within ten minutes.');
