name: Update dashboard traffic statistics
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reporting-traffic
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SITE_TAG: ${{ vars.CLOUDFLARE_SITE_TAG }}
      REPORTING_FIREBASE_REFRESH_TOKEN: ${{ secrets.REPORTING_FIREBASE_REFRESH_TOKEN }}
      REPORTING_START_DATE: '2026-11-15'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reporting configuration
        run: |
          if [ -z "$CLOUDFLARE_ANALYTICS_API_TOKEN" ] || [ -z "$REPORTING_FIREBASE_REFRESH_TOKEN" ]; then
            echo 'Reporting credentials are not configured. Follow docs/reporting.md.'
            exit 1
          fi
      - run: node scripts/sync-cloudflare-reporting.mjs --apply
