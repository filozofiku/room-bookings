<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Faculty room reservations</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:light;background:#f5f7fb;color:#172032}
body{max-width:850px;margin:2rem auto;padding:0 1rem}header,.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}h1{font-size:1.65rem}section{background:#fff;padding:1.2rem;border-radius:14px;margin:1rem 0;box-shadow:0 2px 12px #162a4212}label{display:block;margin:.65rem 0 .25rem;font-weight:600}select,input,button{font:inherit;padding:.55rem .65rem;border-radius:7px;border:1px solid #a8b2bf;max-width:100%}button{background:#144cbd;color:white;cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#4d5a73}button.danger{background:#a62e39}#message{white-space:pre-wrap}.error{color:#a22030}.ok{color:#126335}.slot{display:flex;gap:1rem;align-items:center;padding:.65rem;border-bottom:1px solid #e5e9f2}.slot time{min-width:120px;font-variant-numeric:tabular-nums}.busy{color:#9a2d3b}.free{color:#117641}li{margin:.6rem 0}small{color:#607080}
</style></head><body>
<header><h1>Faculty room reservations</h1><div><span id="identity"></span> <button id="login">Sign in with Google</button> <button id="logout" class="secondary" hidden>Sign out</button></div></header>
<p id="message"></p>
<section id="app" hidden>
<div class="row"><div><label for="date">Date</label><input type="date" id="date"></div><div><label for="room">Room</label><select id="room"></select></div></div>
<h2>Room availability</h2><div id="slots"></div>
<h2>Reserve a room</h2><form id="booking-form">
<label for="title">Event title (shown on the public schedule)</label><input id="title" placeholder="Department meeting" maxlength="120" required style="width:90%">
<div class="row"><div><label for="from">From period</label><select id="from"></select></div><div><label for="through">Through period (inclusive)</label><select id="through"></select></div></div>
<p><small>One-time booking only. Select 1–4 consecutive periods.</small></p><button type="submit">Reserve room</button>
</form>
<h2>My reservations</h2><div id="my-reservations"></div>
</section>
<script type="module" src="/src/main.js"></script>
</body></html>
