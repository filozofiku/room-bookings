<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rezervimi i sallave të fakultetit</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:light;background:#f5f7fb;color:#172032}
body{max-width:850px;margin:2rem auto;padding:0 1rem}header,.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}h1{font-size:1.65rem}section{background:#fff;padding:1.2rem;border-radius:14px;margin:1rem 0;box-shadow:0 2px 12px #162a4212}label{display:block;margin:.65rem 0 .25rem;font-weight:600}select,input,button{font:inherit;padding:.55rem .65rem;border-radius:7px;border:1px solid #a8b2bf;max-width:100%}button{background:#144cbd;color:white;cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#4d5a73}button.danger{background:#a62e39}#message{white-space:pre-wrap}.error{color:#a22030}.ok{color:#126335}.slot{display:flex;gap:1rem;align-items:center;padding:.65rem;border-bottom:1px solid #e5e9f2}.slot time{min-width:120px;font-variant-numeric:tabular-nums}.busy{color:#9a2d3b}.free{color:#117641}li{margin:.6rem 0}small{color:#607080}
#slots .slot{flex-wrap:wrap}#slots .reserve-from{margin-left:auto}#booking-form{scroll-margin-top:1rem}#selection-hint:empty{display:none}
@media(max-width:480px){#slots .reserve-from{margin-left:0}}
</style></head><body>
<header><h1>Rezervimi i sallave të fakultetit</h1><div><span id="identity"></span> <button id="login">Hyni me Google</button> <button id="logout" class="secondary" hidden>Dilni</button></div></header>
<p id="message"></p>
<section id="app" hidden>
<div class="row"><div><label for="date">Data</label><input type="date" id="date"></div><div><label for="room">Salla</label><select id="room"></select></div></div>
<h2>Disponueshmëria e sallës</h2><div id="slots"></div>
<h2>Rezervoni një sallë</h2><form id="booking-form" novalidate>
<label for="title">Titulli i aktivitetit (publikohet me emrin tuaj dhe kohën e rezervimit)</label><input id="title" placeholder="Mbledhje e departamentit" maxlength="120" required style="width:90%">
<div class="row"><div><label for="from">Ora e fillimit</label><select id="from"></select></div><div><label for="through">Ora e përfundimit</label><select id="through"></select></div></div>
<p id="selection-hint" role="status"></p>
<p><small>Rezervimi vlen vetëm për datën e zgjedhur. Zgjidhni 1–16 periudha të njëpasnjëshme (deri në 4 orë).</small></p><button type="submit">Rezervoni sallën</button>
</form>
<h2>Rezervimet e mia</h2><div id="my-reservations"></div>
</section>
<dialog id="cancel-dialog" aria-labelledby="cancel-heading">
<h2 id="cancel-heading">Anulimi i rezervimit</h2><p id="cancel-question"></p>
<form method="dialog"><button value="keep" class="secondary">Mbajeni rezervimin</button> <button value="cancel" class="danger">Anuloni rezervimin</button></form>
</dialog>
<script type="module" src="/src/main.js"></script>
</body></html>
